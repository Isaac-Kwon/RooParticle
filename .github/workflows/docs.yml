name: Docs

# Builds the Doxygen manual and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # same image as CI: the top-level CMakeLists.txt needs ROOT to configure
      image: rootproject/root:latest
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake make g++ ca-certificates doxygen graphviz

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build manual
        run: |
          cmake --build build --target doc
          test -f build/docs/html/index.html
          echo "Doxygen warnings: $(wc -l < build/docs/doxygen-warnings.log)"
          cat build/docs/doxygen-warnings.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
