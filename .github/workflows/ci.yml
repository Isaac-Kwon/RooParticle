name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      # official ROOT image; pin a tag (e.g. 6.36.04-ubuntu25.04, check Docker Hub) for reproducibility
      image: rootproject/root:latest
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake make g++ ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git refuses to read a checkout owned by another user inside a container,
      # which would turn RP_GIT_SHA into "unknown"
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
